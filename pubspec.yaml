name: just_gamepads
description: "Gamepad input for Flutter on Android, iOS, macOS, Windows, Linux and the web (WASM too): Xbox, PlayStation, Nintendo and generic controllers in one standard layout."
version: 0.1.1
homepage: https://engine.justunknown.com/
repository: https://github.com/just-unknown-dev/just-gamepads
issue_tracker: https://github.com/just-unknown-dev/just-gamepads/issues
topics:
  - gamepad
  - controller
  - input
  - gamedev
  - game

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Required by the no-op web plugin registration (lib/src/just_gamepads_web.dart):
  # Flutter's generated web registrant imports it for every web plugin.
  flutter_web_plugins:
    sdk: flutter
  # The web backend reads the browser Gamepad API through package:web and
  # dart:js_interop, which work under both dart2js and dart2wasm.
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.justunknown.justgamepads
        pluginClass: JustGamepadsPlugin
      ios:
        pluginClass: JustGamepadsPlugin
      linux:
        pluginClass: JustGamepadsPlugin
      macos:
        pluginClass: JustGamepadsPlugin
      windows:
        pluginClass: JustGamepadsPluginCApi
      web:
        pluginClass: JustGamepadsWeb
        fileName: src/just_gamepads_web.dart
